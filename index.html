<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Evento</title>

    <!-- Librerías de A-Frame y MindAR -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 2; filterMinCF:0.0001; filterBeta: 0.001;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <!-- Carga de imágenes -->
      <a-assets>
        <img id="cartel1" src="./cartel1.png">
      </a-assets>
      
      <!-- Cámara configurada para máxima calidad de video -->
      <a-camera 
        position="0 0 0" 
        look-controls="enabled: false"
        webcam-baseline="video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }">
      </a-camera>

      <!-- Obra 1 (TargetIndex 0) -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane src="#cartel1" position="0 0 0" width="1" height="0.56" rotation="0 0 0"></a-plane>
      </a-entity>

      <!-- Obra 2 (TargetIndex 1) -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-plane position="0 0 0" width="1" height="0.6" color="blue"></a-plane>
      </a-entity>

    </a-scene>
    
  </body>
</html>
